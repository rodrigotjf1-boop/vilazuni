services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vilazuni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Configure DB_ADMIN_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ../app/migrations/001_storage.sql:/docker-entrypoint-initdb.d/001_storage.sql:ro
      - ./init-runtime.sh:/docker-entrypoint-initdb.d/010_runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d vilazuni']
      interval: 10s
      timeout: 5s
      retries: 6
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: 4173
      VILAZUNI_DATA_DIR: /var/lib/vilazuni
    volumes:
      - private-files:/var/lib/vilazuni
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      VILAZUNI_DOMAIN: ${VILAZUNI_DOMAIN:?Configure VILAZUNI_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on: [app]
volumes:
  database:
  private-files:
  certificates:
  caddy-config:
